name: Sweeper

on:
  schedule:
    # 05:30 AM Madrid time on Mondays (UTC+2) -> 03:30 UTC on Mondays
    - cron: '30 3 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: inbox-sentinel-sweeper
  cancel-in-progress: false

jobs:
  sweeper:
    name: Run Sweeper
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cristiangilsanz' && (github.event_name == 'schedule' || github.actor == 'cristiangilsanz')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject OAuth Credentials & Token
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json
        shell: bash

      - name: Run Sweeper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_CREDENTIALS_PATH: ./credentials.json
          GMAIL_TOKEN_PATH: ./token.json
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: npm run sweeper
